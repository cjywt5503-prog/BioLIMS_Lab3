events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 8080;

        location /api/orders {
            set $order_upstream http://order-sample-service:8001;
            rewrite ^/api/orders(.*)$ /orders$1 break;
            proxy_pass $order_upstream;
        }

        location /api/assays {
            set $assay_upstream http://assay-execution-service:8002;
            rewrite ^/api/assays(.*)$ /assays$1 break;
            proxy_pass $assay_upstream;
        }

        location /api/reports {
            set $report_upstream http://validation-report-service:8003;
            rewrite ^/api/reports(.*)$ /reports$1 break;
            proxy_pass $report_upstream;
        }
    }
}